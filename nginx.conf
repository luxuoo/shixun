# 宝塔面板 Nginx 配置
# 在宝塔 -> 网站 -> 设置 -> 配置文件 中添加

# 压缩：Vite 构建产物与 API 的 JSON 都能显著瘦身（开启后 JS 传输量约降 65%）
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    application/x-javascript image/svg+xml font/woff2;

server {
    listen 80;
    server_name your-domain.com;  # 改成你的域名或IP

    root /www/wwwroot/learning-system/frontend/dist;
    index index.html;

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期强缓存，重复访问不再下载
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口 HTML 不缓存，保证发版后能立即拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 接口响应较慢，超时设长一些
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        # 开启长连接复用，减少频繁建连开销
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 后端文档页面（可选）
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
    }

    # 上传文件静态服务
    location /uploads/ {
        alias /www/wwwroot/learning-system/backend/uploads/;
        expires 7d;
        access_log off;
    }
}
