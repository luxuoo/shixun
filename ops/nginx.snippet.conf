# 发布目录与 webhook 的 Nginx 配置片段
# 说明：一键发布后代码在 .deploy/current（软链，指向 .deploy/releases/<版本>），
#       运行数据（数据库、上传文件、.env）在 .deploy/shared，不随版本切换而变。
# 把下面三段合并进你的站点配置（宝塔：网站 → 设置 → 配置文件），然后 nginx -t && nginx -s reload。

# 1) 前端产物指向当前版本
root /www/wwwroot/learning-system/.deploy/current/frontend/dist;

# 2) 上传文件指向共享目录
location /uploads/ {
    alias /www/wwwroot/learning-system/.deploy/shared/uploads/;
    expires 7d;
}

# 3) GitHub webhook 入口（不用自动发布可删掉）
#    ops/webhook.py 只监听 127.0.0.1:9100，通过这里对外暴露
location /hooks/github {
    proxy_pass http://127.0.0.1:9100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-GitHub-Event $http_x_github_event;
    proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    # 触发后立刻返回，发布在后台跑
    proxy_read_timeout 15s;
}
